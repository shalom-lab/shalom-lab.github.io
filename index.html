<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Shalom Lab - 项目展示和个人作品集">
    <title>Shalom Lab - 项目展示和个人作品集</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Shalom Lab</h1>
            <p class="subtitle">我的项目展示</p>
            <a href="https://github.com/shalom-lab" target="_blank" class="github-link">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
    </header>

    <div class="container">
        <div class="filter-container">
            <button class="filter-btn active" data-category="all">全部</button>
            <!-- 类别过滤按钮将由JS动态添加 -->
        </div>
        
        <div class="projects-grid" id="projects-grid">
            <!-- 项目卡片将由JS动态添加 -->
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2023 Shalom Lab. All rights reserved.</p>
        </div>
    </footer>

    <a href="https://github.com/shalom-lab/shalom-lab.github.io/edit/main/data-raw/projects.json" target="_blank" class="floating-edit-btn" title="编辑项目列表">
        <i class="fas fa-edit"></i>
    </a>

    <script src="./js/main.js"></script>
</body>
</html>
