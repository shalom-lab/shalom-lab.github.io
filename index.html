<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="description" content="Shalom Lab - 项目展示和个人作品集">
    <title>Shalom Lab - 项目展示和个人作品集</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌈</text></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <header>
        <div class="header-content">
            <h1>Shalom Lab</h1>
            <p class="subtitle">我的项目展示</p>
            <a href="https://github.com/shalom-lab" target="_blank" class="github-link">
                <i class="fab fa-github"></i> GitHub
            </a>
        </div>
    </header>

    <div class="container">
        <div class="filter-container">
            <button class="filter-btn active" data-category="all">全部</button>
            <!-- 类别过滤按钮将由JS动态添加 -->
        </div>

        <div class="projects-grid" id="projects-grid">
            <!-- 项目卡片将由JS动态添加 -->
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <p>&copy; 2023 Shalom Lab. All rights reserved.</p>
        </div>
    </footer>

    <div class="float-menu">
        <div class="menu-item wechat">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
            </svg>
        </div>
        <div class="menu-item">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
            </svg>
        </div>
    </div>

    <a href="https://github.com/shalom-lab/shalom-lab.github.io/edit/main/data-raw/projects.json" target="_blank" class="floating-edit-btn" title="编辑项目列表">
        <i class="fas fa-edit"></i>
    </a>

    <script src="./js/main.js"></script>
</body>

</html>
